<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Industrial CIU</title>
    <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">
    <script src="https://checkout.flutterwave.com/v3.js"></script>
    <style>
        :root { --case: #cbd5e1; --lcd: #9db04a; --btn: #1e293b; --green: #22c55e; --red: #ef4444; }
        body { background: #000; display: flex; align-items: center; justify-content: center; height: 100dvh; margin: 0; font-family: sans-serif; overflow: hidden; }
        .ciu { width: 95%; max-width: 380px; height: 90dvh; background: var(--case); border-radius: 40px; padding: 25px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 30px 60px rgba(0,0,0,0.9); border-bottom: 12px solid #475569; }
        .leds { display: flex; gap: 10px; margin-bottom: -5px; }
        .led { width: 10px; height: 10px; border-radius: 50%; background: #64748b; }
        .led.active { animation: blink 1s infinite; background: var(--green); box-shadow: 0 0 8px var(--green); }
        .lcd { background: var(--lcd); height: 25%; border: 6px solid #0f172a; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; box-shadow: inset 0 4px 10px rgba(0,0,0,0.3); }
        .lcd-main { font-family: 'Digital-7 Mono', sans-serif; font-size: 55px; color: #1b2e25; text-align: right; margin-top: auto; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; flex-grow: 1; }
        .key { background: var(--btn); color: white; border: none; border-radius: 15px; font-size: 28px; font-weight: bold; cursor: pointer; box-shadow: 0 5px #000; height: 60px; }
        .key:active { transform: translateY(3px); box-shadow: 0 2px #000; }
        .vend-box { background: #0f172a; padding: 15px; border-radius: 20px; color: white; display: flex; flex-direction: column; gap: 10px; }
        .f-in { width: 100%; height: 40px; border-radius: 8px; border: none; text-align: center; font-weight: bold; }
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; padding: 40px; color: #fff; z-index: 100; text-align: center; }
        @keyframes blink { 50% { opacity: 0.2; } }
    </style>
</head>
<body>

<div class="ciu">
    <div class="leds"><div class="led active"></div><div class="led" id="l_comm"></div></div>
    <div class="lcd">
        <div style="display:flex; justify-content:space-between; font-size:10px; font-weight:900;"><span>YEDC ACE9000 CIU</span><span id="l_msg">READY</span></div>
        <div class="lcd-main" id="l_val">0.00</div>
    </div>
    <div class="keypad">
        <button class="key" onclick="k('1')">1</button><button class="key" onclick="k('2')">2</button><button class="key" onclick="k('3')">3</button>
        <button class="key" onclick="k('4')">4</button><button class="key" onclick="k('5')">5</button><button class="key" onclick="k('6')">6</button>
        <button class="key" onclick="k('7')">7</button><button class="key" onclick="k('8')">8</button><button class="key" onclick="k('9')">9</button>
        <button class="key" style="background:var(--red)" onclick="c()">C</button><button class="key" onclick="k('0')">0</button><button class="key" style="background:var(--green)" onclick="enter()">↵</button>
    </div>
    <div class="vend-box">
        <input type="number" id="m_id" class="f-in" placeholder="METER NUMBER">
        <button onclick="sync()" id="s_btn" style="height:40px; background:#475569; border:none; color:white; border-radius:8px; font-weight:bold;">LINK CIU</button>
        <div id="buy_ui" style="display:none">
            <input type="number" id="amt" class="f-in" placeholder="AMOUNT (₦)">
            <button onclick="pay()" style="height:40px; background:#eab308; border:none; border-radius:8px; font-weight:bold;">VEND UNITS</button>
        </div>
    </div>
</div>

<div id="modal">
    <div id="receipt" style="background:white; color:black; padding:20px; border-radius:10px; font-family:monospace; text-align:left;"></div>
    <button onclick="location.reload()" style="width:100%; height:50px; background:#eab308; margin-top:20px; border:none; font-weight:bold;">DONE</button>
</div>

<script>
    let buf = ""; let vM = ""; let loop = 0; let pToken = ""; let lastUnits = "";
    const API = "https://script.google.com/macros/s/AKfycbzBuz4sikZpAbGH9s3N1iNNIoq6Lo4AZrq4lRKKvM-KZejBeMLLuxXWAYoWcLlQyllO8g/exec"; // REPLACE THIS
    const PUB = "FLWPUBK_LIVE_xxxxxxxxxxxx"; // REPLACE THIS

    function k(v) { buf += v; document.getElementById('l_val').innerText = buf; }
    function c() { buf = ""; document.getElementById('l_val').innerText = "0.00"; }

    async function sync() {
        const m = document.getElementById('m_id').value || buf;
        document.getElementById('l_msg').innerText = "LINKING...";
        document.getElementById('l_comm').classList.add('active');
        try {
            const r = await (await fetch(`${API}?meter=${m}&monitor=true`)).json();
            if(r.status === "success") {
                vM = m;
                document.getElementById('l_msg').innerText = "LINK SUCCESSFUL";
                document.getElementById('l_val').innerText = "88888";
                setTimeout(() => {
                    document.getElementById('l_msg').innerText = "WALLET BAL";
                    document.getElementById('l_val').innerText = r.wallet;
                    setTimeout(() => {
                        document.getElementById('buy_ui').style.display = 'block';
                        document.getElementById('s_btn').style.display = 'none';
                        setInterval(() => {
                            const info = [{v: r.voltage, m: "VOLTS"}, {v: "---", m: r.name.substring(0,12)}];
                            let s = info[loop % 2];
                            document.getElementById('l_val').innerText = s.v;
                            document.getElementById('l_msg').innerText = s.m;
                            loop++;
                        }, 4000);
                    }, 3000);
                }, 2000);
            }
        } catch(e) { document.getElementById('l_msg').innerText = "RETRY"; }
        document.getElementById('l_comm').classList.remove('active');
    }

    function pay() {
        const a = document.getElementById('amt').value;
        FlutterwaveCheckout({
            public_key: PUB, tx_ref: "NX-"+Date.now(), amount: parseInt(a)+100, currency: "NGN",
            callback: async (p) => {
                document.getElementById('l_msg').innerText = "VENDING...";
                const res = await (await fetch(`${API}?verify_ref=${p.transaction_id}&amt=${a}&meter=${vM}`)).json();
                if(res.status === "success") {
                    pToken = res.token; lastUnits = res.units;
                    document.getElementById('l_val').innerText = pToken;
                    document.getElementById('l_msg').innerText = "PRESS ENTER (↵)";
                }
            }
        });
    }

    function enter() {
        if(pToken !== "" && document.getElementById('l_val').innerText === pToken) {
            document.getElementById('l_msg').innerText = "LOADING...";
            setTimeout(() => {
                document.getElementById('l_val').innerText = lastUnits;
                document.getElementById('l_msg').innerText = "LOADED SUCCESSFUL";
                setTimeout(() => { 
                    document.getElementById('receipt').innerHTML = `<h2>YEDC RECEIPT</h2><hr>METER: ${vM}<br>TOKEN: ${pToken}<br>UNITS: ${lastUnits}kWh<hr>STATUS: LOADED`; 
                    document.getElementById('modal').style.display = 'block'; 
                }, 2000);
            }, 2000);
            pToken = "";
        } else if(buf) {
            // Standard STS Code logic can be added here
            buf = "";
        }
    }
</script>
</body>
</html>
